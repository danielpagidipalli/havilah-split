<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Havilah Wedding — Expense Split</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F0; --panel:#FFFFFF; --panel2:#F6F0E6; --line:#E5DBC9;
    --maroon:#7B2233; --maroon-dark:#5C1826; --gold:#A8842C; --gold-lt:#D9BC7A;
    --ink:#332B26; --muted:#8C8072; --red:#B5432F; --green:#4E7C4A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:70px;}
  header{background:var(--maroon-dark); border-bottom:3px solid var(--gold); text-align:center; padding:26px 16px 20px;}
  .eyebrow{font-size:11px; letter-spacing:.35em; color:var(--gold-lt); text-transform:uppercase; margin-bottom:8px;}
  h1{font-family:'Cormorant Garamond',serif; font-size:32px; color:#FDF9F2; font-weight:600;}
  .subtitle{color:#C9A9A9; font-size:13px; margin-top:6px;}
  .syncbar{margin-top:10px; display:flex; justify-content:center; align-items:center; gap:10px;}
  .syncstate{font-size:11.5px; color:#B08D8D;}
  .refresh-btn{background:rgba(255,255,255,.08); border:1px solid rgba(217,188,122,.4); color:var(--gold-lt); border-radius:999px; padding:4px 12px; font-size:11.5px; cursor:pointer;}
  main{max-width:680px; margin:0 auto; padding:20px 14px; display:grid; gap:16px;}
  .notice{background:var(--panel2); border:1px dashed var(--gold); border-radius:10px; padding:10px 14px; font-size:12.5px; color:var(--muted); text-align:center;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:0 1px 3px rgba(60,40,20,.05);}
  .label{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:12px;}
  input,select{background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:10px 12px; font-size:15px; width:100%; font-family:'Inter',sans-serif; outline:none;}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--maroon); outline-offset:2px;}
  input::placeholder{color:var(--muted);}
  .btn{background:var(--maroon); color:#FDF9F2; border:none; border-radius:8px; padding:10px 18px; font-weight:600; font-size:14px; cursor:pointer; white-space:nowrap; font-family:'Inter',sans-serif;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .row{display:flex; gap:8px;}
  .member-item{display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line); padding:10px 0; flex-wrap:wrap;}
  .member-name{font-weight:600; font-size:14.5px; min-width:90px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{border:1px solid var(--line); background:var(--panel2); color:var(--muted); border-radius:999px; padding:5px 11px; font-size:12px; cursor:pointer; user-select:none;}
  .chip.on{background:var(--maroon); border-color:var(--maroon); color:#FDF9F2; font-weight:600;}
  .xbtn{background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; padding:2px 6px;}
  .tabs{display:flex; gap:8px; flex-wrap:wrap;}
  .tab{background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:9px 14px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;}
  .tab.active{background:var(--maroon); color:#FDF9F2; border-color:var(--maroon);}
  .tab small{font-weight:400; opacity:.75; margin-left:5px; font-size:11.5px;}
  .stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 8px; text-align:center; box-shadow:0 1px 3px rgba(60,40,20,.05);}
  .stat .k{font-size:10px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase;}
  .stat .v{font-family:'Cormorant Garamond',serif; font-size:20px; color:var(--maroon); font-weight:600; margin-top:3px;}
  .exp-row{display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding:8px 0; font-size:14px;}
  .payer{color:var(--maroon); font-weight:600;}
  .item{color:var(--muted);}
  .bal-row{display:flex; justify-content:space-between; align-items:center; font-size:14px; padding:6px 0;}
  .bal-sub{color:var(--muted); font-size:12px;}
  .owes{color:var(--red); font-weight:600;}
  .gets{color:var(--green); font-weight:600;}
  .settled{color:var(--muted); font-weight:600;}
  .settle-card{border:1.5px solid var(--gold);}
  .txn{background:var(--panel2); border-radius:10px; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; font-size:15px; margin-bottom:8px;}
  .txn .amt{font-family:'Cormorant Garamond',serif; font-size:19px; color:var(--maroon); font-weight:600;}
  .fullbtn{width:100%; margin-top:8px;}
  .muted-note{color:var(--muted); font-size:13.5px;}
  .error-banner{background:#FBEAE6; border:1px solid var(--red); color:var(--red); border-radius:10px; padding:12px 14px; font-size:13px; display:none;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
  @media(max-width:420px){ .member-item{align-items:flex-start;} }
</style>
</head>
<body>

<header>
  <div class="eyebrow">✦ Family Expense Sharing ✦</div>
  <h1>Havilah Wedding</h1>
  <div class="subtitle" id="grandline">Each group splits equally among its own members.</div>
  <div class="syncbar">
    <span class="syncstate" id="syncstate">● Connecting…</span>
    <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
  </div>
</header>

<main>
  <div class="error-banner" id="errbox"></div>

  <div class="notice">Shared board — everyone with the link sees and edits the same list. No login needed.</div>

  <!-- MEMBERS -->
  <div class="card">
    <div class="label">Members — tick the groups each person belongs to</div>
    <div class="row">
      <input id="newName" placeholder="Name (e.g. Daniel)" onkeydown="if(event.key==='Enter')addMember()">
      <button class="btn" onclick="addMember()">Add</button>
    </div>
    <div id="memberList" style="margin-top:6px;"></div>
  </div>

  <!-- GROUP TABS -->
  <div class="tabs" id="tabs"></div>

  <!-- GROUP PANEL -->
  <div id="groupPanel"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://kwcjmjzhzwxigzubneak.supabase.co";
const SUPABASE_KEY = "sb_publishable_ljFc4IfCwV7x_0LhvyYC5Q_-QVZMxqu";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const GROUPS = [
  { key:"Bachelors", col:"in_bachelors" },
  { key:"Marriage",  col:"in_marriage"  },
  { key:"Suits",     col:"in_suits"     },
];

let members = [];   // {id,name,in_bachelors,in_marriage,in_suits}
let expenses = [];  // {id,member,grp,item,amount}
let activeGroup = "Bachelors";

const inr = n => "₹" + Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:0});
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function showErr(msg){
  const b = document.getElementById("errbox");
  b.textContent = msg; b.style.display = "block";
}
function hideErr(){ document.getElementById("errbox").style.display = "none"; }

function setSync(t){ document.getElementById("syncstate").textContent = "● " + t; }

async function loadAll(){
  try{
    const [m, e] = await Promise.all([
      db.from("members").select("*").order("created_at"),
      db.from("expenses").select("*").order("created_at"),
    ]);
    if (m.error) throw m.error;
    if (e.error) throw e.error;
    members = m.data || [];
    expenses = e.data || [];
    hideErr();
    setSync("Synced " + new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}));
    render();
  }catch(err){
    setSync("Connection problem");
    showErr("Could not load data: " + (err.message || err) + ". Check internet, then tap Refresh.");
  }
}

// ---------------- MEMBERS ----------------
async function addMember(){
  const inp = document.getElementById("newName");
  const name = inp.value.trim();
  if(!name) return;
  if(members.some(m => m.name.toLowerCase() === name.toLowerCase())){
    alert(name + " is already added."); return;
  }
  const {error} = await db.from("members").insert({name});
  if(error){ showErr("Could not add member: " + error.message); return; }
  inp.value = "";
  loadAll();
}

async function toggleGroup(id, col, current){
  const {error} = await db.from("members").update({[col]: !current}).eq("id", id);
  if(error){ showErr("Could not update: " + error.message); return; }
  loadAll();
}

async function deleteMember(id, name){
  if(expenses.some(e => e.member === name)){
    alert(name + " has expenses logged. Delete those expenses first."); return;
  }
  if(!confirm("Remove " + name + " from the board?")) return;
  const {error} = await db.from("members").delete().eq("id", id);
  if(error){ showErr("Could not remove: " + error.message); return; }
  loadAll();
}

// ---------------- EXPENSES ----------------
async function addExpense(){
  const payer = document.getElementById("payerSel").value;
  const item  = document.getElementById("itemInp").value.trim() || "Purchase";
  const amt   = parseFloat(document.getElementById("amtInp").value);
  if(!payer){ alert("Select who paid."); return; }
  if(!amt || amt <= 0){ alert("Enter a valid amount."); return; }
  const {error} = await db.from("expenses").insert({member:payer, grp:activeGroup, item, amount:amt});
  if(error){ showErr("Could not add expense: " + error.message); return; }
  document.getElementById("itemInp").value = "";
  document.getElementById("amtInp").value = "";
  loadAll();
}

async function deleteExpense(id){
  if(!confirm("Delete this expense for everyone?")) return;
  const {error} = await db.from("expenses").delete().eq("id", id);
  if(error){ showErr("Could not delete: " + error.message); return; }
  loadAll();
}

// ---------------- CALC ----------------
function groupCalc(gkey){
  const g = GROUPS.find(x => x.key === gkey);
  const gMembers = members.filter(m => m[g.col]);
  const gExps = expenses.filter(e => e.grp === gkey);
  const total = gExps.reduce((s,e)=>s+Number(e.amount),0);
  const share = gMembers.length ? total / gMembers.length : 0;
  const paidBy = {};
  gMembers.forEach(m => paidBy[m.name] = 0);
  gExps.forEach(e => { paidBy[e.member] = (paidBy[e.member]||0) + Number(e.amount); });
  const balances = {};
  gMembers.forEach(m => balances[m.name] = (paidBy[m.name]||0) - share);
  // note: if a non-member somehow paid, count them as pure creditor
  gExps.forEach(e => {
    if(!(e.member in balances)) balances[e.member] = (balances[e.member]||0) + Number(e.amount);
  });
  return { gMembers, gExps, total, share, paidBy, balances, settlements: settle(balances) };
}

function settle(balances){
  const cr=[], de=[];
  Object.entries(balances).forEach(([n,b])=>{
    if(b > 0.01) cr.push({n, a:b});
    else if(b < -0.01) de.push({n, a:-b});
  });
  cr.sort((x,y)=>y.a-x.a); de.sort((x,y)=>y.a-x.a);
  const t=[]; let i=0,j=0;
  while(i<de.length && j<cr.length){
    const p=Math.min(de[i].a, cr[j].a);
    t.push({from:de[i].n, to:cr[j].n, amt:p});
    de[i].a-=p; cr[j].a-=p;
    if(de[i].a<0.01)i++; if(cr[j].a<0.01)j++;
  }
  return t;
}

// ---------------- COPY ----------------
async function copySummary(){
  const c = groupCalc(activeGroup);
  let msg = "*HAVILAH WEDDING — " + activeGroup + " Split*\n\n";
  msg += "Total spent: " + inr(c.total) + "\n";
  msg += "Members in this group: " + c.gMembers.length + "\n";
  msg += "Equal share: " + inr(Math.round(c.share)) + " per person\n\n*Paid:*\n";
  c.gMembers.forEach(m => msg += "• " + m.name + ": " + inr(c.paidBy[m.name]||0) + "\n");
  msg += "\n*Settlement:*\n";
  if(!c.settlements.length) msg += "All settled — no payments needed.\n";
  c.settlements.forEach(t => msg += "• " + t.from + " pays " + t.to + " " + inr(Math.round(t.amt)) + "\n");
  try{ await navigator.clipboard.writeText(msg);
    const b=document.getElementById("copyBtn");
    b.textContent="Copied — paste in WhatsApp";
    setTimeout(()=>{ b.textContent="Copy " + activeGroup + " Summary for WhatsApp"; },2000);
  }catch(e){ alert(msg); }
}

// ---------------- RENDER ----------------
function render(){
  // grand total
  const grand = expenses.reduce((s,e)=>s+Number(e.amount),0);
  document.getElementById("grandline").textContent =
    grand>0 ? "Total across all groups: " + inr(grand) : "Each group splits equally among its own members.";

  // member list
  const ml = document.getElementById("memberList");
  ml.innerHTML = members.map(m => `
    <div class="member-item">
      <span class="member-name">${esc(m.name)}</span>
      <span class="chips">
        ${GROUPS.map(g => `
          <span class="chip ${m[g.col] ? "on" : ""}" onclick="toggleGroup('${m.id}','${g.col}',${m[g.col]})">${g.key}</span>
        `).join("")}
      </span>
      <button class="xbtn" aria-label="Remove ${esc(m.name)}" onclick="deleteMember('${m.id}','${esc(m.name)}')">×</button>
    </div>
  `).join("") || `<div class="muted-note" style="margin-top:8px;">Add family members, then tick which groups they belong to.</div>`;

  // tabs
  document.getElementById("tabs").innerHTML = GROUPS.map(g => {
    const c = groupCalc(g.key);
    return `<button class="tab ${g.key===activeGroup?"active":""}" onclick="activeGroup='${g.key}';render();">
      ${g.key}${c.total>0?`<small>${inr(c.total)}</small>`:""}
    </button>`;
  }).join("");

  // group panel
  const c = groupCalc(activeGroup);
  let html = `
    <div class="stats">
      <div class="stat"><div class="k">${esc(activeGroup)} Total</div><div class="v">${inr(c.total)}</div></div>
      <div class="stat"><div class="k">Group Members</div><div class="v">${c.gMembers.length}</div></div>
      <div class="stat"><div class="k">Share Each</div><div class="v">${inr(Math.round(c.share))}</div></div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="label">Add expense → ${esc(activeGroup)}</div>`;
  if(c.gMembers.length === 0){
    html += `<div class="muted-note">No members in ${esc(activeGroup)} yet — tick "${esc(activeGroup)}" for the right people in the member list above.</div>`;
  } else {
    html += `
      <div style="display:grid; gap:10px;">
        <select id="payerSel">
          <option value="">Who paid?</option>
          ${c.gMembers.map(m=>`<option value="${esc(m.name)}">${esc(m.name)}</option>`).join("")}
        </select>
        <input id="itemInp" placeholder="What was purchased (e.g. Decoration, Cake, Suit stitching)">
        <div class="row">
          <input id="amtInp" type="number" inputmode="decimal" placeholder="Amount ₹" onkeydown="if(event.key==='Enter')addExpense()">
          <button class="btn" onclick="addExpense()">Add</button>
        </div>
      </div>`;
  }
  html += `</div>`;

  if(c.gExps.length){
    html += `<div class="card" style="margin-top:16px;">
      <div class="label">${esc(activeGroup)} — Expense Log</div>
      ${c.gExps.map(e=>`
        <div class="exp-row">
          <div><span class="payer">${esc(e.member)}</span> <span class="item">— ${esc(e.item)}</span></div>
          <div style="display:flex; gap:10px; align-items:center;">
            <span style="font-weight:500;">${inr(e.amount)}</span>
            <button class="xbtn" aria-label="Delete expense" onclick="deleteExpense('${e.id}')">×</button>
          </div>
        </div>`).join("")}
    </div>`;
  }

  if(c.gMembers.length && c.total > 0){
    html += `<div class="card" style="margin-top:16px;">
      <div class="label">${esc(activeGroup)} — Where Everyone Stands</div>
      ${c.gMembers.map(m=>{
        const b = c.balances[m.name];
        const settled = Math.abs(b) < 1;
        const cls = settled ? "settled" : (b>0 ? "gets" : "owes");
        const txt = settled ? "Settled" : (b>0 ? "Gets back " + inr(Math.round(b)) : "Owes " + inr(Math.round(-b)));
        return `<div class="bal-row">
          <div><div style="font-weight:600;">${esc(m.name)}</div>
          <div class="bal-sub">Paid ${inr(c.paidBy[m.name]||0)} · Share ${inr(Math.round(c.share))}</div></div>
          <div class="${cls}">${txt}</div>
        </div>`;
      }).join("")}
    </div>`;
  }

  if(c.settlements.length){
    html += `<div class="card settle-card" style="margin-top:16px;">
      <div class="label">${esc(activeGroup)} — Who Pays Whom</div>
      ${c.settlements.map(t=>`
        <div class="txn">
          <div><span class="owes">${esc(t.from)}</span> <span class="item">pays</span> <span class="gets">${esc(t.to)}</span></div>
          <div class="amt">${inr(Math.round(t.amt))}</div>
        </div>`).join("")}
      <button class="btn fullbtn" id="copyBtn" onclick="copySummary()">Copy ${esc(activeGroup)} Summary for WhatsApp</button>
    </div>`;
  }

  document.getElementById("groupPanel").innerHTML = html;
}

// init + auto-refresh
loadAll();
setInterval(loadAll, 12000);
</script>
</body>
</html>
